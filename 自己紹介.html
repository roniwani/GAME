<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOL.lol</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #070709;
            height: 100vh;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        #particle-field {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            border-radius: 9999px;
            will-change: transform;
            pointer-events: none;
        }

        .star {
            position: absolute;
            will-change: transform;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: starTwinkle 2s ease-in-out infinite alternate;
        }

        .cross {
            position: absolute;
            will-change: transform;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.12);
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: crossGlow 3s ease-in-out infinite alternate;
        }

        @keyframes starTwinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes crossGlow {
            0% {
                opacity: 0.1;
                transform: scale(0.9) rotate(0deg);
            }
            100% {
                opacity: 0.4;
                transform: scale(1.1) rotate(10deg);
            }
        }

        #enter-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(7, 7, 9, 0.95);
            backdrop-filter: blur(8px);
            transition: opacity 1s ease, visibility 1s ease;
            cursor: pointer;
        }
        #enter-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .enter-text {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.8em;
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .enter-text:hover {
            color: rgba(255, 255, 255, 0.7);
            transform: scale(1.02);
        }

        #main-content {
            opacity: 0;
            transition: opacity 0.01s ease;
            pointer-events: none;
        }
        #main-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .animate-item {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #main-content.visible .animate-item {
            opacity: 1;
            transform: translateY(0);
        }
        #main-content.visible .avatar-container {
            transition-delay: 0.05s;
        }
        #main-content.visible .main-name {
            transition-delay: 0.15s;
        }
        #main-content.visible .typing-wrapper {
            transition-delay: 0.25s;
        }
        #main-content.visible .roles {
            transition-delay: 0.35s;
        }
        #main-content.visible .discord-wrapper {
            transition-delay: 0.50s;
        }
        #main-content.visible .team-tag-wrapper {
            transition-delay: 0.65s;
        }

        .avatar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0 auto 0.8rem auto;
            pointer-events: none;
            flex-shrink: 0;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            background-image: url('FBA26DEF-B80C-4F8A-8644-6FEA6B710558.JPG');
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            margin: 0;
        }
        .avatar i {
            opacity: 0.15;
        }

        .main-name {
            font-size: 4.2rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.92);
            margin: 0 auto 0.2rem auto;
            line-height: 1.2;
            text-align: center;
            width: 100%;
        }

        .typing-wrapper {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.25);
            min-height: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2px;
            margin-bottom: 0.2rem;
            width: 100%;
        }
        #typed-text {
            display: inline-block;
            white-space: nowrap;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: rgba(255, 255, 255, 0.3);
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .roles {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            width: 100%;
        }
        .role-badge {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.4rem 1.6rem 0.4rem 1.2rem;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            transition: none !important;
            cursor: default;
        }
        .role-badge:hover {
            transform: none !important;
            border-color: rgba(255, 255, 255, 0.04) !important;
            background: rgba(255, 255, 255, 0.015) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3) !important;
        }
        .role-badge .role-icon {
            font-size: 1rem;
            width: 1.4rem;
            text-align: center;
            transition: none !important;
        }
        .role-badge .role-label {
            font-weight: 500;
        }
        .role-badge.verified .role-icon {
            color: rgba(255, 255, 255, 0.6);
        }
        .role-badge.developer .role-icon {
            color: rgba(255, 255, 255, 0.4);
        }

        .discord-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.9rem 2.8rem 0.9rem 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: border-color 0.4s ease, background 0.4s ease;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
            min-width: 340px;
        }
        .discord-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
        }
        .server-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            background-image: url('file_1784724122974.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .server-icon i {
            opacity: 0.2;
        }
        .discord-link {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1rem;
            text-decoration: none;
            transition: color 0.4s ease;
            font-weight: 300;
            letter-spacing: 0.1em;
            background: transparent;
            border: none;
        }
        .discord-link i {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.2);
            transition: color 0.4s ease;
        }
        .discord-link:hover {
            color: #fff;
        }
        .discord-link:hover i {
            color: #fff;
        }
        .discord-link .server-name {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.4s ease;
        }
        .discord-link:hover .server-name {
            color: #fff;
        }
        .owner-tag {
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.2rem 1rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.01);
            text-transform: uppercase;
            transition: all 0.4s ease;
            white-space: nowrap;
        }
        .discord-wrapper:hover .owner-tag {
            color: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
        }

        .team-tag-wrapper {
            margin-top: 2.2rem;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .team-tag {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.04), 0 0 120px rgba(255, 255, 255, 0.02);
            padding-top: 1.2rem;
            width: 100%;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }
        .team-tag::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }
        .team-tag .highlight {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.8em;
        }

        #footer-bar {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            pointer-events: none;
        }
        #footer-bar>* {
            pointer-events: auto;
        }
        .audio-player {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 0.4rem 1.5rem 0.4rem 1.2rem;
            border-radius: 60px;
            background: rgba(10, 10, 15, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }
        .audio-player:hover {
            border-color: rgba(255, 255, 255, 0.06);
            background: rgba(14, 14, 20, 0.6);
        }
        #playBtn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        #playBtn:hover {
            color: #fff;
            transform: scale(1.15);
        }
        #playBtn:active {
            transform: scale(0.9);
        }
        .track-info {
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-info .track-name {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
        }
        .playing-indicator {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .playing-indicator .bar {
            width: 2px;
            height: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .playing-indicator .bar.active {
            background: rgba(255, 255, 255, 0.2);
            animation: barPulse 0.8s ease-in-out infinite alternate;
        }
        .playing-indicator .bar:nth-child(2).active {
            animation-delay: 0.2s;
            height: 12px;
        }
        .playing-indicator .bar:nth-child(3).active {
            animation-delay: 0.4s;
            height: 6px;
        }
        .playing-indicator .bar:nth-child(4).active {
            animation-delay: 0.1s;
            height: 10px;
        }
        .playing-indicator .bar:nth-child(5).active {
            animation-delay: 0.3s;
            height: 4px;
        }
        @keyframes barPulse {
            0% {
                height: 3px;
                opacity: 0.1;
            }
            100% {
                height: 14px;
                opacity: 1;
            }
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .volume-icon-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
        }
        .volume-icon-btn:hover {
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.03);
        }
        .volume-icon-btn:active {
            transform: scale(0.9);
        }

        @media (max-width: 700px) {
            .avatar {
                width: 110px;
                height: 110px;
                font-size: 3rem;
            }
            .main-name {
                font-size: 3rem;
            }
            .typing-wrapper {
                font-size: 0.8rem;
                padding: 0 1rem;
            }
            #typed-text {
                white-space: normal;
                word-break: break-word;
            }
            .discord-wrapper {
                padding: 0.7rem 1.6rem;
                gap: 0.8rem;
                min-width: 240px;
            }
            .enter-text {
                font-size: 1.2rem;
                letter-spacing: 0.4em;
                white-space: normal;
            }
            .team-tag {
                font-size: 1rem;
                letter-spacing: 0.3em;
                padding-top: 1rem;
            }
            .roles {
                gap: 1.2rem;
            }
            .role-badge {
                padding: 0.3rem 1rem;
                font-size: 0.55rem;
                gap: 0.4rem;
            }
            .role-badge .role-icon {
                font-size: 0.8rem;
                width: 1.2rem;
            }
        }
        @media (max-width: 450px) {
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }
            .main-name {
                font-size: 2.2rem;
            }
            .typing-wrapper {
                font-size: 0.65rem;
            }
            .discord-wrapper {
                padding: 0.5rem 1rem;
                gap: 0.5rem;
                min-width: 180px;
                border-radius: 16px;
            }
            .server-icon {
                width: 30px;
                height: 30px;
                border-radius: 8px;
                font-size: 0.6rem;
            }
            .discord-link {
                font-size: 0.7rem;
            }
            .discord-link i {
                font-size: 0.9rem;
            }
            .owner-tag {
                font-size: 0.4rem;
                padding: 0.1rem 0.5rem;
            }
            .audio-player {
                padding: 0.25rem 0.7rem;
                gap: 0.4rem;
                border-radius: 30px;
            }
            .track-info {
                max-width: 40px;
                font-size: 0.45rem;
            }
            #playBtn {
                font-size: 0.8rem;
                width: 24px;
                height: 24px;
            }
            .volume-icon-btn {
                width: 24px;
                height: 24px;
                font-size: 0.8rem;
            }
            .enter-text {
                font-size: 0.9rem;
                letter-spacing: 0.2em;
                white-space: normal;
                text-align: center;
            }
            .playing-indicator .bar {
                height: 6px;
            }
            .playing-indicator .bar:nth-child(2).active {
                height: 9px;
            }
            .playing-indicator .bar:nth-child(4).active {
                height: 8px;
            }
            @keyframes barPulse {
                0% {
                    height: 2px;
                }
                100% {
                    height: 10px;
                }
            }
            .team-tag {
                font-size: 0.75rem;
                letter-spacing: 0.2em;
                padding-top: 0.8rem;
            }
            .team-tag::after {
                width: 80px;
            }
            .roles {
                gap: 0.8rem;
            }
            .role-badge {
                padding: 0.2rem 0.7rem;
                font-size: 0.45rem;
                gap: 0.3rem;
            }
            .role-badge .role-icon {
                font-size: 0.6rem;
                width: 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="particle-field"></div>

    <div id="enter-overlay">
        <div class="enter-text">CLICK TO ENTER</div>
    </div>

    <div id="main-content">
        <div id="overlay">

            <div class="avatar-container animate-item">
                <div class="avatar" id="profileAvatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <h1 class="main-name animate-item">roniwani</h1>

            <div class="typing-wrapper animate-item">
                <span id="typed-text"></span><span class="cursor"></span>
            </div>

            <div class="roles animate-item">
                <div class="role-badge verified">
                    <i class="fas fa-circle-check role-icon"></i>
                    <span class="role-label">Verified</span>
                </div>
                <div class="role-badge developer">
                    <i class="fas fa-code role-icon"></i>
                    <span class="role-label">Developer</span>
                </div>
            </div>

            <div class="discord-wrapper animate-item">
                <div class="server-icon" id="serverIcon">
                    <i class="fas fa-hashtag"></i>
                </div>
                <a href="https://discord.gg/NbypSpEfFX" target="_blank" class="discord-link">
                    <i class="fab fa-discord"></i>
                    <span class="server-name">Pulsar Hub</span>
                </a>
                <span class="owner-tag">Owner</span>
            </div>

            <div class="team-tag-wrapper animate-item">
                <div class="team-tag">
                    TEAM <span class="highlight">✦</span> ENTROPY
                </div>
            </div>

        </div>

        <div id="footer-bar">
            <div class="audio-player">
                <button id="playBtn"><i class="fas fa-play"></i></button>
                <div class="track-info"><span class="track-name">worry</span></div>
                <div class="playing-indicator">
                    <span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <div class="volume-wrapper">
                    <button class="volume-icon-btn" id="volumeIconBtn"><i class="fas fa-volume-up"></i></button>
                </div>
            </div>
        </div>
    </div>

    <audio id="bgm" src="worry.mp3" loop preload="auto"></audio>

    <script>
        (function() {
            const enterOverlay = document.getElementById('enter-overlay');
            const mainContent = document.getElementById('main-content');
            const audio = document.getElementById('bgm');
            const playBtn = document.getElementById('playBtn');
            const playIcon = playBtn.querySelector('i');
            const volumeIconBtn = document.getElementById('volumeIconBtn');
            const volumeIcon = volumeIconBtn.querySelector('i');
            const bars = document.querySelectorAll('.playing-indicator .bar');

            let isMuted = false;
            let prevVolume = 0.7;

            function updatePlayState(isPlaying) {
                if (isPlaying) {
                    playIcon.className = 'fas fa-pause';
                    bars.forEach(bar => bar.classList.add('active'));
                } else {
                    playIcon.className = 'fas fa-play';
                    bars.forEach(bar => bar.classList.remove('active'));
                }
            }

            function updateVolumeIcon() {
                if (isMuted || audio.volume === 0) {
                    volumeIcon.className = 'fas fa-volume-off';
                } else if (audio.volume < 0.5) {
                    volumeIcon.className = 'fas fa-volume-down';
                } else {
                    volumeIcon.className = 'fas fa-volume-up';
                }
            }

            volumeIconBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isMuted) {
                    audio.volume = prevVolume || 0.7;
                    isMuted = false;
                } else {
                    prevVolume = audio.volume;
                    audio.volume = 0;
                    isMuted = true;
                }
                updateVolumeIcon();
            });

            playBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (audio.paused) {
                    audio.play().then(() => {
                        updatePlayState(true);
                    }).catch(() => {
                        alert('⚠️ 音声ファイル (worry.mp3) が見つかりません。');
                        updatePlayState(false);
                    });
                } else {
                    audio.pause();
                    updatePlayState(false);
                }
            });

            audio.addEventListener('ended', function() {
                updatePlayState(false);
            });

            audio.addEventListener('volumechange', function() {
                if (audio.volume === 0) {
                    isMuted = true;
                } else {
                    isMuted = false;
                    prevVolume = audio.volume;
                }
                updateVolumeIcon();
            });

            enterOverlay.addEventListener('click', function() {
                enterOverlay.classList.add('hidden');
                mainContent.classList.add('visible');
                startTyping();
                audio.play().then(() => {
                    updatePlayState(true);
                }).catch(() => {
                    updatePlayState(false);
                });
            });

            const FIELD = document.getElementById('particle-field');

            const DOT_COUNT = 180;
            const dots = [];
            const rand = (min, max) => Math.random() * (max - min) + min;

            for (let i = 0; i < DOT_COUNT; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                const left = rand(0, 100);
                const top = rand(0, 100);
                const size = rand(1.5, 5.5);
                dot.style.left = left + '%';
                dot.style.top = top + '%';
                dot.style.width = size + 'px';
                dot.style.height = size + 'px';
                dot.style.opacity = rand(0.3, 0.9);
                dot.style.background = 'rgba(255,255,255,0.12)';
                dot.style.boxShadow = '0 0 ' + rand(4, 12) + 'px rgba(255,255,255,0.03)';
                const initialOffset = rand(-30, 0);
                dot.style.transform = 'translateY(' + initialOffset + 'px)';
                const data = {
                    el: dot,
                    speed: rand(0.001, 0.015),
                    amplitude: rand(2, 30),
                    phase: rand(0, Math.PI * 2),
                    driftX: Math.random() < 0.3 ? rand(-0.2, 0.2) : 0,
                };
                dots.push(data);
                FIELD.appendChild(dot);
            }

            const STAR_COUNT = 30;
            const starEls = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = '★';
                star.style.left = rand(0, 100) + '%';
                star.style.top = rand(0, 100) + '%';
                star.style.fontSize = rand(6, 14) + 'px';
                star.style.color = `rgba(255,255,255,${rand(0.2, 0.5)})`;
                star.style.animationDelay = rand(0, 3) + 's';
                star.style.animationDuration = rand(1.5, 3.5) + 's';
                star.style.textShadow = '0 0 ' + rand(4, 12) + 'px rgba(255,255,255,0.03)';
                const data = {
                    el: star,
                    speed: rand(0.002, 0.02),
                    amplitude: rand(3, 25),
                    phase: rand(0, Math.PI * 2),
                    driftX: Math.random() < 0.3 ? rand(-0.2, 0.2) : 0,
                };
                starEls.push(data);
                FIELD.appendChild(star);
            }

            const CROSS_COUNT = 15;
            const crossEls = [];
            for (let i = 0; i < CROSS_COUNT; i++) {
                const cross = document.createElement('div');
                cross.className = 'cross';
                cross.textContent = '✚';
                cross.style.left = rand(0, 100) + '%';
                cross.style.top = rand(0, 100) + '%';
                cross.style.fontSize = rand(8, 18) + 'px';
                cross.style.color = `rgba(200,200,255,${rand(0.08, 0.25)})`;
                cross.style.animationDelay = rand(0, 4) + 's';
                cross.style.animationDuration = rand(2, 5) + 's';
                cross.style.textShadow = '0 0 ' + rand(6, 16) + 'px rgba(200,200,255,0.03)';
                const data = {
                    el: cross,
                    speed: rand(0.001, 0.012),
                    amplitude: rand(2, 20),
                    phase: rand(0, Math.PI * 2),
                    driftX: Math.random() < 0.3 ? rand(-0.15, 0.15) : 0,
                };
                crossEls.push(data);
                FIELD.appendChild(cross);
            }

            let startTime = performance.now();

            function animateDots() {
                const now = performance.now();
                const t = (now - startTime) / 1000;

                for (const d of dots) {
                    const offsetY = Math.sin(t * d.speed + d.phase) * d.amplitude;
                    const offsetX = Math.sin(t * d.speed * 0.7 + d.phase * 1.3) * (d.driftX * 8);
                    d.el.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px)';
                }

                for (const s of starEls) {
                    const offsetY = Math.sin(t * s.speed + s.phase) * s.amplitude;
                    const offsetX = Math.sin(t * s.speed * 0.6 + s.phase * 1.4) * (s.driftX * 6);
                    s.el.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px)';
                }

                for (const c of crossEls) {
                    const offsetY = Math.sin(t * c.speed + c.phase) * c.amplitude;
                    const offsetX = Math.sin(t * c.speed * 0.5 + c.phase * 1.6) * (c.driftX * 5);
                    c.el.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px)';
                }

                requestAnimationFrame(animateDots);
            }
            animateDots();

            const text = "smilehub";
            const typedSpan = document.getElementById('typed-text');
            let charIndex = 0;
            let isDeleting = false;
            let isPaused = false;
            let typingStarted = false;

            function typeEffect() {
                if (isPaused) return;
                if (!isDeleting) {
                    if (charIndex < text.length) {
                        typedSpan.textContent += text.charAt(charIndex);
                        charIndex++;
                        setTimeout(typeEffect, 70);
                    } else {
                        isPaused = true;
                        setTimeout(() => {
                            isPaused = false;
                            isDeleting = true;
                            typeEffect();
                        }, 2000);
                    }
                } else {
                    if (charIndex > 0) {
                        typedSpan.textContent = text.substring(0, charIndex - 1);
                        charIndex--;
                        setTimeout(typeEffect, 45);
                    } else {
                        isDeleting = false;
                        isPaused = true;
                        setTimeout(() => {
                            isPaused = false;
                            typeEffect();
                        }, 500);
                    }
                }
            }

            function startTyping() {
                if (typingStarted) return;
                typingStarted = true;
                typeEffect();
            }

            updateVolumeIcon();

        })();
    </script>
</body>
</html>
