<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smile Pet - Interactive</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100vw;height:100vh}
#hint{position:fixed;left:16px;bottom:14px;padding:9px 13px;border-radius:12px;background:#09101ddd;border:1px solid #ffffff1c;color:#d9e3f7;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">🎾 ボールを持ったらカーソルを動かして位置を決め、クリックで投げる　🍖 ご飯もカーソルで運べる</div>
<script>
const cv=document.getElementById("game"),ctx=cv.getContext("2d");
let W,H,D;
function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();

const K={};addEventListener("keydown",e=>{K[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==="r")reset()});
addEventListener("keyup",e=>K[e.key.toLowerCase()]=false);

let saveKey="smilePetInteractive";
let data=JSON.parse(localStorage.getItem(saveKey)||"null")||{
 name:"Mochi",level:1,xp:0,coins:150,hunger:82,happy:82,energy:90,health:100,evolution:0
};
function save(){localStorage.setItem(saveKey,JSON.stringify(data));message("💾 セーブしたよ！")}
function reset(){if(confirm("セーブデータをリセットしますか？")){localStorage.removeItem(saveKey);location.reload()}}

let mouse={x:W/2,y:H/2,down:false};
cv.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
cv.addEventListener("mousedown",e=>{mouse.down=true;click(e.clientX,e.clientY)});
cv.addEventListener("mouseup",()=>mouse.down=false);
cv.addEventListener("mouseleave",()=>mouse.down=false);

let state="idle",timer=0,food={x:0,y:0},ball={x:0,y:0,vx:0,vy:0,phase:"none",targetX:0,targetY:0};
let pet={x:W*.5,y:H*.54,vx:0,vy:0,face:"happy",carryBall:false};
let messageText="Mochiと遊ぼう！",messageTime=180;
let particles=[];

function message(t){messageText=t;messageTime=150}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function addXP(n){
 data.xp+=n;
 const need=100+data.level*40;
 if(data.xp>=need){
  data.xp-=need;data.level++;data.coins+=50;
  if(data.level>=5&&data.evolution<1)data.evolution=1;
  if(data.level>=10&&data.evolution<2)data.evolution=2;
  if(data.level>=15&&data.evolution<3)data.evolution=3;
  message("✨ レベルアップ！ "+data.name+" が成長した！");
  burst(pet.x,pet.y,"#ffd45e",24);
 }
}
function burst(x,y,col,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-1.3)*5,a:1,col})}

function button(x,y,w,h){return mouse.x>x&&mouse.x<x+w&&mouse.y>y&&mouse.y<y+h}

let buttons={};
function click(mx,my){
 mouse.x=mx;mouse.y=my;

 // Active feeding: move food with cursor and feed when close to mouth.
 if(state==="feeding"){
   if(distance({x:mx,y:my},{x:pet.x,y:pet.y-18})<75){
     finishFeed();
   }else message("🍖 もう少しペットの口元へ！");
   return;
 }
 // Active ball: cursor controls held ball; click throws it.
 if(state==="holdingBall"){
   throwBall();
   return;
 }
 if(state==="resting")return;

 if(button("🍖"))startFeed();
 else if(button("🎾"))startBall();
 else if(button("💤"))startRest();
 else if(button("💾"))save();
 else if(distance({x:mx,y:my},pet)<145){
   data.happy=Math.min(100,data.happy+3);addXP(3);burst(mx,my,"#ff9bc9",5);message("❤️ なでなでした！");
 }
}
function startFeed(){
 if(data.hunger>=97)return message("😋 もうおなかいっぱい！");
 if(data.coins<5)return message("🪙 コインが足りないよ！");
 data.coins-=5;state="feeding";timer=0;pet.face="excited";message("🍖 ご飯を持ったよ！カーソルで口元へ運ぼう！");
}
function finishFeed(){
 data.hunger=Math.min(100,data.hunger+30);data.health=Math.min(100,data.health+5);
 addXP(20);state="eating";timer=0;pet.face="eating";message("😋 もぐもぐ……おいしい！");
 burst(pet.x,pet.y-20,"#ffd46b",12);
}
function startBall(){
 if(data.energy<15)return message("⚡ 元気が足りないよ！");
 state="holdingBall";timer=0;pet.face="excited";
 ball.phase="held";message("🎾 ボールを持ったよ！カーソルを動かして投げる場所を決めよう！");
}
function throwBall(){
 if(ball.phase!=="held")return;
 const sx=pet.x+18,sy=pet.y-25;
 const tx=clamp(mouse.x,260,W-80),ty=clamp(mouse.y,130,H-150);
 ball.x=sx;ball.y=sy;ball.targetX=tx;ball.targetY=ty;
 const dx=tx-sx,dy=ty-sy,dist=Math.hypot(dx,dy)||1;
 ball.vx=dx/dist*Math.min(12,5+dist/90);
 ball.vy=dy/dist*Math.min(12,5+dist/90)-4;
 ball.phase="flying";state="throwing";timer=0;
 data.energy=Math.max(0,data.energy-8);
 pet.face="excited";
 message("🎾 それっ！取りに行こう！");
}
function finishBall(){
 ball.phase="none";pet.carryBall=false;state="idle";timer=0;
 data.happy=Math.min(100,data.happy+25);data.coins+=10;addXP(30);
 message("🎾 ナイスキャッチ！ +10コイン");
 burst(pet.x,pet.y-25,"#ff86be",16);
}
function startRest(){state="resting";timer=0;pet.face="sleep";message("💤 すやすや……")}
function drawPet(){
 let s=Math.max(.72,Math.min(1.18,Math.min(W,H)/800));
 ctx.save();ctx.translate(pet.x,pet.y);ctx.scale(s,s);
 let body=data.evolution===0?"#f4c3a4":data.evolution===1?"#9fdcff":data.evolution===2?"#c4a0ff":"#ffe08b";
 let bob=state==="resting"?Math.sin(timer/18)*2:Math.sin(performance.now()/250)*3;
 ctx.translate(0,bob);

 ctx.fillStyle="#0004";ctx.beginPath();ctx.ellipse(0,102,95,20,0,0,7);ctx.fill();
 ctx.fillStyle=body;
 ctx.beginPath();ctx.moveTo(-78,-62);ctx.lineTo(-58,-135);ctx.lineTo(-22,-86);ctx.fill();
 ctx.beginPath();ctx.moveTo(78,-62);ctx.lineTo(58,-135);ctx.lineTo(22,-86);ctx.fill();
 ctx.beginPath();ctx.ellipse(0,12,88,98,0,0,7);ctx.fill();

 ctx.fillStyle="#fff6";ctx.beginPath();ctx.ellipse(0,42,53,57,0,0,7);ctx.fill();

 // face
 if(pet.face==="sleep"){
  ctx.strokeStyle="#182137";ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-43,-20);ctx.lineTo(-24,-14);ctx.moveTo(24,-14);ctx.lineTo(43,-20);ctx.stroke();
  ctx.beginPath();ctx.arc(0,6,9,0,7);ctx.stroke();
 }else{
  ctx.fillStyle="#182137";ctx.beginPath();ctx.arc(-30,-20,10,0,7);ctx.arc(30,-20,10,0,7);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-27,-23,3,0,7);ctx.arc(33,-23,3,0,7);ctx.fill();
  ctx.strokeStyle="#182137";ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,pet.face==="excited"?18:14,.15,Math.PI-.15);ctx.stroke();
 }
 if(data.evolution>=2){
  ctx.fillStyle="#ffd45e";ctx.beginPath();ctx.moveTo(-38,-118);ctx.lineTo(-27,-150);ctx.lineTo(-6,-126);ctx.lineTo(14,-153);ctx.lineTo(26,-124);ctx.lineTo(49,-142);ctx.lineTo(43,-110);ctx.closePath();ctx.fill();
 }
 if(data.evolution>=3){
  ctx.fillStyle="#ffffffaa";ctx.beginPath();ctx.arc(-85,5,12,0,7);ctx.arc(85,5,12,0,7);ctx.fill();
 }
 ctx.restore();
}
function drawBall(x,y,held=false){
 ctx.save();ctx.translate(x,y);
 ctx.shadowBlur=held?18:8;ctx.shadowColor="#ff6eae";
 ctx.fillStyle="#ff79b2";ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();ctx.shadowBlur=0;
 ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*1.15);ctx.stroke();
 ctx.restore();
}
function drawFood(x,y){
 ctx.save();ctx.translate(x,y);ctx.font="38px system-ui";ctx.fillText("🍖",0,0);ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#172744");g.addColorStop(1,"#10192b");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="#ffffff08";for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,72);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=80;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

 ctx.fillStyle="#080e1be8";ctx.fillRect(0,0,W,70);
 ctx.fillStyle="#fff";ctx.font="800 27px system-ui";ctx.fillText("☺ SMILE PET",22,45);
 ctx.fillStyle="#ffd45e";ctx.font="700 18px system-ui";ctx.fillText("🪙 "+data.coins,W-150,30);
 ctx.fillStyle="#aab9d5";ctx.font="12px system-ui";ctx.fillText("LV."+data.level+"  "+data.name,W-150,52);

 stat("🍖 おなか",data.hunger,22,92,220);stat("❤️ げんき",data.health,22,134,220);
 stat("😊 きもち",data.happy,22,176,220);stat("⚡ 元気",data.energy,22,218,220);

 let need=100+data.level*40;ctx.fillStyle="#aab9d5";ctx.font="12px system-ui";ctx.fillText("NEXT LEVEL",22,278);
 ctx.fillStyle="#080e1b";round(22,287,220,15,8);ctx.fillStyle="#907cff";round(24,289,216*data.xp/need,11,6);
 ctx.fillStyle="#dce5fa";ctx.font="11px system-ui";ctx.fillText(Math.floor(data.xp)+" / "+need,88,301);

 ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="800 24px system-ui";ctx.fillText(data.name,W*.5,104);
 ctx.fillStyle="#9eb0d0";ctx.font="13px system-ui";
 let stage=data.evolution===0?"BABY":data.evolution===1?"GROWN":data.evolution===2?"SUPER":"ULTIMATE";
 ctx.fillText(stage,W*.5,127);ctx.textAlign="left";

 // Ball throwing target marker
 if(state==="holdingBall"){
  ctx.setLineDash([6,6]);ctx.strokeStyle="#ff9ac8aa";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(mouse.x,mouse.y,24,0,7);ctx.stroke();ctx.setLineDash([]);
  drawBall(mouse.x,mouse.y,true);
 }
 if(state==="feeding"){
  drawFood(mouse.x-18,mouse.y+8);
  ctx.fillStyle="#ffffff25";ctx.beginPath();ctx.arc(pet.x,pet.y-18,75,0,7);ctx.fill();
 }

 drawPet();

 if(state==="throwing"||state==="fetching"){
  drawBall(ball.x,ball.y,false);
 }
 if(state==="fetching"){
  ctx.fillStyle="#b9d1ff";ctx.font="700 14px system-ui";ctx.textAlign="center";ctx.fillText("🐾 ボールをくわえてる！",pet.x,pet.y-150);ctx.textAlign="left";
 }

 // buttons
 const bw=170,bh=56,gap=16,total=bw*4+gap*3,start=(W-total)/2,by=H-94;
 buttons.feed={x:start,y:by,w:bw,h:bh};buttons.play={x:start+bw+gap,y:by,w:bw,h:bh};
 buttons.rest={x:start+(bw+gap)*2,y:by,w:bw,h:bh};buttons.save={x:start+(bw+gap)*3,y:by,w:bw,h:bh};
 const arr=[["🍖 ごはん","#df9b56",buttons.feed],["🎾 あそぶ","#d86eaa",buttons.play],["💤 休む","#6588ce",buttons.rest],["💾 セーブ","#64748b",buttons.save]];
 for(const [t,col,b] of arr){ctx.fillStyle=col;round(b.x,b.y,b.w,b.h,16);ctx.fillStyle="#fff";ctx.font="700 15px system-ui";ctx.textAlign="center";ctx.fillText(t,b.x+b.w/2,b.y+35)}
 ctx.textAlign="left";

 if(messageTime>0){messageTime--;ctx.font="700 14px system-ui";let tw=Math.min(W-30,Math.max(280,ctx.measureText(messageText).width+65));ctx.fillStyle="#080e1bea";round((W-tw)/2,145,tw,44,14);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(messageText,W/2,173);ctx.textAlign="left"}

 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.a-=.025;ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.col;ctx.font="20px system-ui";ctx.fillText("♥",p.x,p.y);if(p.a<=0)particles.splice(i,1)}
 ctx.globalAlpha=1;
}
function stat(label,val,x,y,w){ctx.fillStyle="#080e1b";round(x,y,w,34,12);ctx.fillStyle="#293650";round(x+2,y+2,w-4,30,10);ctx.fillStyle=val>60?"#61e5a2":val>30?"#ffd166":"#ff7189";round(x+4,y+4,(w-8)*val/100,26,8);ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.fillText(label+"  "+Math.round(val)+"%",x+12,y+22)}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}

let last=performance.now();
function update(){
 const now=performance.now(),dt=Math.min(2,(now-last)/16.67);last=now;
 timer+=dt;
 if(state==="eating"&&timer>80){state="idle";pet.face="happy";timer=0}
 if(state==="throwing"){
   ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=.28*dt;ball.vx*=.995;
   if(ball.y>H-145 || ball.x>W-45 || ball.x<245){
    ball.x=clamp(ball.x,245,W-45);ball.y=clamp(ball.y,100,H-145);
    state="fetching";timer=0;pet.face="excited";
    message("🐾 ダッシュ！ボールを取りに行ってる！");
   }
 }
 if(state==="fetching"){
   const dx=ball.x-pet.x,dy=ball.y-pet.y,d=Math.hypot(dx,dy)||1;
   const speed=4.5*dt;
   pet.x+=dx/d*speed;pet.y+=dy/d*speed;
   if(d<38){
    pet.carryBall=true;state="returning";timer=0;
    message("🎾 キャッチ！持って帰ってくるよ！");
   }
 }
 if(state==="returning"){
   const tx=W*.5,ty=H*.54,dx=tx-pet.x,dy=ty-pet.y,d=Math.hypot(dx,dy)||1;
   pet.x+=dx/d*4.2*dt;pet.y+=dy/d*4.2*dt;ball.x=pet.x+20;ball.y=pet.y-20;
   if(d<35)finishBall();
 }
 if(state==="resting"&&timer>180){
   data.energy=Math.min(100,data.energy+35);data.health=Math.min(100,data.health+8);
   data.happy=Math.min(100,data.happy+6);data.hunger=Math.max(0,data.hunger-4);
   addXP(12);burst(pet.x,pet.y,"#9dbbff",12);state="idle";timer=0;pet.face="happy";message("🌙 ぐっすり休んだ！元気いっぱい！");
 }
 draw();requestAnimationFrame(update);
}
function statDecay(){
 data.hunger=Math.max(0,data.hunger-1);data.energy=Math.max(0,data.energy-1);data.happy=Math.max(0,data.happy-1);
}
setInterval(()=>{statDecay();saveSilent()},18000);
function saveSilent(){localStorage.setItem(saveKey,JSON.stringify(data))}
update();
</script>
</body>
</html>
