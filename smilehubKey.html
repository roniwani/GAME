<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>smilehub - Get Key</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #001a00;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* ネオン光のエフェクト */
    body::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80%;
      background: radial-gradient(ellipse, rgba(0, 255, 65, 0.4) 0%, rgba(0, 255, 65, 0.1) 40%, transparent 70%);
      filter: blur(60px);
      z-index: 0;
      animation: neonPulse 2s ease-in-out infinite alternate;
    }

    /* 追加のネオン光（複数レイヤー） */
    body::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 30%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(0, 255, 65, 0.2) 0%, transparent 60%);
      filter: blur(80px);
      z-index: 0;
      animation: neonPulse2 3s ease-in-out infinite alternate;
    }

    .container {
      position: relative;
      z-index: 1;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 3rem;
      font-weight: bold;
      text-shadow: 
        0 0 10px #00ff41,
        0 0 20px #00ff41,
        0 0 40px #00ff41,
        0 0 80px #00ff41,
        0 0 120px #00ff41;
      margin-bottom: 10px;
      color: #fff;
      animation: textGlow 1.5s ease-in-out infinite alternate;
    }

    h2 {
      font-size: 2rem;
      text-shadow: 
        0 0 10px #00ff41,
        0 0 20px #00ff41,
        0 0 40px #00ff41;
      margin-bottom: 30px;
      color: #ccffcc;
    }

    .key-box {
      font-size: 1.5rem;
      padding: 15px 30px;
      background-color: #001a00;
      color: #00ff41;
      border: 2px solid #00ff41;
      border-radius: 10px;
      margin: 20px auto;
      display: inline-block;
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
      box-shadow: 
        0 0 20px rgba(0, 255, 65, 0.5),
        0 0 40px rgba(0, 255, 65, 0.3),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
      animation: boxGlow 2s ease-in-out infinite alternate;
      font-weight: bold;
      letter-spacing: 2px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid #00ff41;
      border-radius: 5px;
      background: transparent;
      color: #00ff41;
      cursor: pointer;
      text-shadow: 0 0 10px #00ff41;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #00ff41, #00cc33, #00ff41, #00cc33);
      background-size: 400% 400%;
      border-radius: 5px;
      z-index: -1;
      animation: borderGlow 3s linear infinite;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    button:hover::before {
      opacity: 1;
    }

    button:hover {
      transform: scale(1.1);
      background: rgba(0, 255, 65, 0.2);
      box-shadow: 
        0 0 30px rgba(0, 255, 65, 0.6),
        0 0 60px rgba(0, 255, 65, 0.4);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes neonPulse {
      0% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
      }
    }

    @keyframes neonPulse2 {
      0% {
        opacity: 0.3;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0.6;
        transform: translate(10%, 10%) scale(1.3);
      }
    }

    @keyframes textGlow {
      0% {
        text-shadow: 
          0 0 10px #00ff41,
          0 0 20px #00ff41,
          0 0 40px #00ff41,
          0 0 80px #00ff41;
      }
      100% {
        text-shadow: 
          0 0 20px #00ff41,
          0 0 40px #00ff41,
          0 0 60px #00ff41,
          0 0 100px #00ff41,
          0 0 150px #00ff41;
      }
    }

    @keyframes boxGlow {
      0% {
        box-shadow: 
          0 0 20px rgba(0, 255, 65, 0.5),
          0 0 40px rgba(0, 255, 65, 0.3),
          inset 0 0 20px rgba(0, 255, 65, 0.1);
      }
      100% {
        box-shadow: 
          0 0 30px rgba(0, 255, 65, 0.7),
          0 0 60px rgba(0, 255, 65, 0.5),
          0 0 80px rgba(0, 255, 65, 0.3),
          inset 0 0 30px rgba(0, 255, 65, 0.2);
      }
    }

    @keyframes borderGlow {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>smilehub</h1>
    <h2>Get Key ↓</h2>
    <div class="key-box" id="key">smileingkey</div>
    <button onclick="copyKey()">Copy Key</button>
  </div>

  <script>
    function copyKey() {
      const key = document.getElementById("key").innerText;
      const tempInput = document.createElement("textarea");
      tempInput.value = key;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);
      alert("Key copied: " + key);
    }
  </script>
</body>
</html>
